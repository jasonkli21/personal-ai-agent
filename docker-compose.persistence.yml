name: personal-ai-persistence

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: personal_ai
      POSTGRES_USER: personal_ai
      POSTGRES_PASSWORD: personal_ai_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - personal-ai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_ai -d personal_ai"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  dynamodb-local:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    working_dir: /home/dynamodblocal
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - personal-ai-dynamodb:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/shell/ >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  postgres-test:
    image: pgvector/pgvector:0.8.1-pg17
    profiles: ["integration"]
    environment:
      POSTGRES_DB: personal_ai_test
      POSTGRES_USER: personal_ai
      POSTGRES_PASSWORD: personal_ai_test_only
    ports:
      - "127.0.0.1:54330:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_ai -d personal_ai_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  dynamodb-local-test:
    image: amazon/dynamodb-local:2.6.1
    profiles: ["integration"]
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    working_dir: /home/dynamodblocal
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/shell/ >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  personal-ai-postgres:
  personal-ai-dynamodb:
