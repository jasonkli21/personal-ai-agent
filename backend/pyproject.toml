[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-ai-backend"
version = "0.1.0"
description = "FastAPI backend for a personal AI system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.0,<3.0",
  "google-cloud-firestore>=2.16,<3.0",
  "google-cloud-pubsub>=2.21,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
  "httpx>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
