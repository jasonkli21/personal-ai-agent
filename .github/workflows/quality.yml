name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.13"
      - run: uv sync --locked --only-group build --no-install-project
      - run: uv sync --locked --extra dev --group build --no-build-isolation
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m personal_ai.evaluation.context
      - run: python -m personal_ai.evaluation.memory
      - run: python -m personal_ai.evaluation.memory_lifecycle
      - run: uv build --no-build-isolation

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag personal-ai-api:ci ./backend
      - run: docker build --tag personal-ai-web:ci ./frontend
